name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*"]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Check disk space before cleanup
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force

      - name: Check disk space after cleanup
        run: df -h

      - name: Setup | Apt packages
        run: sudo apt-get update

      - name: Setup | Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt, llvm-tools-preview

      - name: Setup | Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup | Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Setup | Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup | Just
        uses: taiki-e/install-action@just

      - name: Test | CI Pipeline
        run: just ci

  # The doublezero-solana CLI ships as a static musl binary so it loads on any
  # Linux regardless of the host glibc version. Build it for the musl target
  # and assert the result is fully static.
  rust-cli-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build CLI for musl and assert it is statically linked
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release -p doublezero-solana-cli --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/doublezero-solana
          file "$bin"
          if file "$bin" | grep -qE "statically linked|static-pie linked"; then
            echo "OK: $bin is statically linked"
          else
            echo "::error::doublezero-solana CLI is not statically linked"
            exit 1
          fi
